<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TECH WIKIPEDIA — Quantum Frontier</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b1120;
      --card: #131c31;
      --border: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }
    header { margin-bottom: 16px; }
    h1 { font-size: 1.25rem; color: var(--accent); }
    .sub { font-size: 0.85rem; color: var(--muted); }
    #search {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.95rem;
    }
    .grid { display: grid; gap: 12px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .tag {
      display: inline-block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .card h2 { font-size: 1.05rem; margin-bottom: 6px; }
    .card p { font-size: 0.9rem; color: var(--muted); }
    .card a {
      display: inline-block;
      margin-top: 8px;
      color: var(--accent);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
    }
    #status { color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>TECH WIKIPEDIA — Quantum Frontier</h1>
    <div class="sub">Live Knowledge Feed</div>
  </header>

  <input id="search" type="search" placeholder="Search topics..." />
  <div id="status">Loading live data...</div>
  <div id="feed" class="grid"></div>

  <script>
    const SCRIPT_URL = "PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    let allItems = [];
    const feedEl = document.getElementById("feed");
    const statusEl = document.getElementById("status");
    const searchEl = document.getElementById("search");

    function render(items) {
      feedEl.innerHTML = "";
      if (!items.length) {
        statusEl.textContent = "No entries found.";
        return;
      }
      statusEl.textContent = "";
      items.forEach(item => {
        const title = item.Title || item.title || item.Name || Object.values(item)[0] || "Untitled";
        const category = item.Category || item.category || "";
        const summary = item.Summary || item.Description || item.description || "";
        const link = item.Link || item.URL || item.url || "";

        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML = `
          ${category ? `<div class="tag">${escapeHtml(category)}</div>` : ""}
          <h2>${escapeHtml(title)}</h2>
          ${summary ? `<p>${escapeHtml(summary)}</p>` : ""}
          ${link ? `<a href="${escapeAttr(link)}" target="_blank" rel="noopener">Open Resource →</a>` : ""}
        `;
        feedEl.appendChild(card);
      });
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, "&quot;");
    }

    searchEl.addEventListener("input", () => {
      const q = searchEl.value.toLowerCase().trim();
      if (!q) return render(allItems);
      render(allItems.filter(item =>
        Object.values(item).some(val => String(val).toLowerCase().includes(q))
      ));
    });

    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        allItems = data.items || [];
        render(allItems);
      })
      .catch(() => {
        statusEl.textContent = "Failed to load Sheet data. Check Web App URL and 'Anyone' access.";
      });
  </script>
</body>
</html>
