<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TECH WIKIPEDIA — Quantum Frontier</title>
  <style>
    :root {
      --bg: #070b14;
      --card: #0f172a;
      --border: #1e293b;
      --accent: #38bdf8;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 1.5rem;
    }
    .container { max-width: 900px; margin: 0 auto; }
    header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
    }
    h1 { font-size: 1.75rem; color: var(--accent); letter-spacing: 0.5px; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-top: 0.25rem; }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      margin-bottom: 1.25rem;
      font-size: 0.85rem;
    }
    .badge {
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
    }
    input[type="search"] {
      width: 100%;
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 1rem;
    }
    .grid { display: grid; gap: 1rem; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1.25rem;
    }
    .card-tag {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }
    .card h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    .card p { color: var(--muted); font-size: 0.95rem; }
    footer {
      margin-top: 2.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>TECH WIKIPEDIA — Quantum Frontier</h1>
      <p class="subtitle">Live Knowledge Feed</p>
    </header>

    <div class="status-bar">
      <span id="status-text">Initializing Quantum Knowledge Feed...</span>
      <span class="badge" id="source-badge">SYNCING</span>
    </div>

    <input type="search" id="search" placeholder="Filter Quantum Frontier entries..." />
    <div class="grid" id="feed"></div>

    <footer>
      Clifford Ray Hackett • <a href="mailto:crh2509@icloud.com">crh2509@icloud.com</a> • 671-IKNOWME
    </footer>
  </div>

  <script>
    const WEB_APP_URL = "YOUR_APPS_SCRIPT_EXEC_URL_HERE";

    const FALLBACK_ENTRIES = [
      {
        category: "Quantum Entanglement",
        title: "Non-Local State Correlation & Bell Pairs",
        summary: "Entangled qubits share a unified wave function across arbitrary distances, enabling instantaneous state correlation, quantum key distribution (QKD), and multi-node teleportation protocols."
      },
      {
        category: "Many-Worlds & Phase Coherence",
        title: "Dominant Frequency Projection (DFP)",
        summary: "Under the Many-Worlds Interpretation, parallel timeline branches coexist in phase space; coherent hemispheric resonance tunes observer awareness toward target probability nodes."
      },
      {
        category: "Quantum Hardware",
        title: "Multi-Qubit GHZ Cat States & Silicon Spin Qubits",
        summary: "Scaling coherent entanglement across superconducting processors and room-temperature nuclear spin architectures reduces decoherence and accelerates fault-tolerant simulation."
      },
      {
        category: "Post-Quantum Cryptography",
        title: "Lattice-Based Encryption & Shor Resistance",
        summary: "As logical qubit counts climb toward breaking RSA-2048, lattice-based algorithms (ML-KEM / ML-DSA) secure decentralized ledgers and cloud endpoints against quantum decryption."
      },
      {
        category: "Quantum Tunneling",
        title: "Barrier Penetration & Sub-Nanometer Transistors",
        summary: "Wave-particle duality allows charge carriers to traverse potential energy barriers classically forbidden, powering tunnel diodes, flash memory, and scanning tunneling microscopy."
      },
      {
        category: "Vacuum Energy & Field Theory",
        title: "Zero-Point Fluctuations & Casimir Cavities",
        summary: "Quantum electrodynamics demonstrates that empty space seethes with virtual particle pairs and measurable zero-point energy gradients between closely spaced conductive plates."
      },
      {
        category: "Consciousness & Hemi-Sync",
        title: "Binaural Phase Locking & Gateway Resonance",
        summary: "Stereo frequency offsets (100–120 Hz carrier differentials) entrain bilateral brainwave synchronization, modeling non-local information access within holographic field frameworks."
      }
    ];

    let activeEntries = [];

    function render(items) {
      const feed = document.getElementById("feed");
      feed.innerHTML = items.map(item => `
        <article class="card">
          <div class="card-tag">${item.category || "Quantum Frontier"}</div>
          <h2>${item.title || "Untitled Entry"}</h2>
          <p>${item.summary || item.description || ""}</p>
        </article>
      `).join("");
    }

    async function loadFeed() {
      const statusText = document.getElementById("status-text");
      const badge = document.getElementById("source-badge");

      if (!WEB_APP_URL || WEB_APP_URL.includes("YOUR_APPS_SCRIPT")) {
        activeEntries = FALLBACK_ENTRIES;
        statusText.textContent = "Showing 7 built-in Quantum Frontier entries (Offline Fallback Mode).";
        badge.textContent = "FALLBACK (7)";
        render(activeEntries);
        return;
      }

      try {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 5000);
        const res = await fetch(WEB_APP_URL, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const rows = Array.isArray(data) ? data : (data.items || data.data || []);
        if (!rows.length) throw new Error("Empty feed");

        activeEntries = rows;
        statusText.textContent = `Loaded ${rows.length} live entries from Google Sheets.`;
        badge.textContent = "LIVE SHEET";
        render(activeEntries);
      } catch (err) {
        activeEntries = FALLBACK_ENTRIES;
        statusText.textContent = "Live Sheet unavailable — loaded 7 built-in fallback entries.";
        badge.textContent = "FALLBACK (7)";
        render(activeEntries);
      }
    }

    document.getElementById("search").addEventListener("input", (e) => {
      const q = e.target.value.toLowerCase();
      const filtered = activeEntries.filter(item =>
        (item.title || "").toLowerCase().includes(q) ||
        (item.category || "").toLowerCase().includes(q) ||
        (item.summary || item.description || "").toLowerCase().includes(q)
      );
      render(filtered);
    });

    loadFeed();
  </script>
</body>
</html>
